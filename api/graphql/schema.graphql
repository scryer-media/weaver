"""
Live health for one configured news server, derived from the NNTP connection pool.
"""
type ServerHealth {
	host: String!
	port: Int!
	"""
	`host:port` label.
	"""
	label: String!
	"""
	"PRIMARY" for the highest-priority server, "BACKUP" otherwise.
	"""
	tier: String!
	"""
	One of "healthy", "degraded", "cooling_down", "disabled".
	"""
	state: String!
	"""
	What this server is doing right now, as one word a rail can lead with:
	"downloading", "idle", "preparing", "over_limit", "cooling_down",
	"degraded" or "disabled". A bare connection fraction reads as a fault
	when the pool is deliberately holding back, so the state is the
	headline and the counts are the detail.
	"""
	activity: String!
	"""
	When the current activity is expected to end, if the daemon knows:
	the holdoff deadline while "over_limit", the cooldown deadline while
	"cooling_down". Absent for every activity that has no deadline.
	"""
	activityUntilEpochMs: Int
	"""
	Sockets currently open to this server — owned lanes, warm lanes and
	async pool connections alike — whether or not they carry a request.
	"""
	connectionsOpen: Int!
	"""
	Open sockets currently carrying a request.
	"""
	connectionsBusy: Int!
	"""
	Currently in-use connections (max - available permits).
	"""
	connectionsActive: Int!
	"""
	Configured maximum connections (legacy field).
	"""
	connectionsMax: Int!
	"""
	Saved operator-configured maximum connections.
	"""
	connectionsConfigured: Int!
	"""
	End of the current provider over-limit holdoff, if one is active.
	"""
	capacityPenaltyUntilEpochMs: Int
	"""
	Active NNTP runtime generation.
	"""
	runtimeGeneration: Int!
	"""
	EWMA request latency in milliseconds.
	"""
	latencyMs: Float!
	"""
	EWMA command-to-status-line wait for BODY fetches, in milliseconds.
	Absent until the download lanes have taken an unbiased sample.
	"""
	bodyLatencyMs: Float
	"""
	EWMA status-line-to-terminator wait for one article, in milliseconds:
	what the article itself costs on the wire.
	"""
	bodyTransferMs: Float
	"""
	"good", "moderate" or "slow" for `bodyLatencyMs`.
	"""
	bodyLatencyBand: String
	"""
	BODY pipelining depth the lanes currently run at; 1 is sequential.
	"""
	bodyPipelineDepth: Int!
	"""
	Set once the server has twice failed to answer a pipelined batch
	cleanly, which holds it sequential for the rest of the process.
	"""
	bodyPipeliningPinnedSequential: Boolean!
	successCount: Int!
	failureCount: Int!
	consecutiveFailures: Int!
	"""
	Connections that died before reaching a healthy age, recently.
	"""
	prematureDeaths: Int!
	legs: [NetworkLegFlow!]!
	"""
	The resolved address new connections to this server dial, once an
	address race has picked one. Absent before the first connect and for
	a server reached through a proxy.
	"""
	pinnedAddress: String
}

