type SupportReport {
	"""
	Compact plain text, at most 80 columns, for a fenced block.
	"""
	text: String!
	"""
	The same report with every field, as pretty-printed JSON.
	"""
	json: String!
}

type SystemComputeInfo {
	physicalCores: Int!
	logicalCores: Int!
	cgroupLimit: Float
	decoderTier: DecoderTierGql!
	simdFeatures: [String!]!
	"""
	The kernel each hot-path library dispatches to on this host.
	"""
	kernels: [KernelSelectionInfo!]!
}

type SystemInfo {
	version: String!
	uptimeSeconds: Float!
	deployment: DeploymentEnvironmentGql!
	operatingSystem: OperatingSystemGql!
	architecture: String!
	databaseEngine: DatabaseEngineGql!
	compute: SystemComputeInfo!
	memory: SystemMemoryInfo!
	primaryStorage: SystemStorageProfile!
	configuredStorage: [ConfiguredStorage!]!
}

type SystemMemoryInfo {
	totalBytes: Int!
	availableAtStartupBytes: Int!
	cgroupLimitBytes: Int
	effectiveLimitBytes: Int!
}

type SystemMetricsSnapshot {
	metrics: Metrics!
	globalState: GlobalQueueState!
	"""
	Servers currently refusing new connections as over their limit.
	"""
	providerHoldoffs: [ProviderHoldoff!]!
	"""
	Download rate of every job currently transferring, sampled on the same
	tick and pushed on the same cadence as `metrics.currentDownloadSpeed`.
	A queue row that reads its rate from here cannot drift from the global
	gauge the way the event-driven queue item, published at most once a
	second, always did.
	"""
	jobDownloadRates: [JobDownloadRate!]!
	"""
	Connections each server has open right now, on the same cadence, so a
	connection meter can follow the pool instead of waiting for the next
	`serverHealth` read.
	"""
	providerConnections: [ProviderConnections!]!
}

type SystemStatus {
	version: String!
	globalState: GlobalQueueState!
	summary: QueueSummary!
}

type SystemStorageProfile {
	storageClass: String!
	filesystem: String!
	startupRandomReadIops: Float!
}

type TestConnectionResult {
	legs: [LegConnectionTest!]!
	success: Boolean!
	message: String!
	latencyMs: Int
	"""
	Command-to-status-line round trip on the open session. `latencyMs` is
	the whole connect (TCP, TLS, authentication); this is the distance the
	download lanes have to work against.
	"""
	firstByteLatencyMs: Int
	"""
	"good", "moderate" or "slow" for `firstByteLatencyMs`. Descriptive: the
	download depth is chosen automatically and needs no operator input.
	"""
	firstByteLatencyBand: String
	supportsPipelining: Boolean!
	adoptableTlsNameMismatchCertificate: AdoptableTlsNameMismatchCertificate
	"""
	IANA name of the negotiated TLS suite with weaver's CPU-preferred family offered first.
	"""
	tlsCipherSuite: String
	"""
	Whether the server followed the client's cipher order (null when not determined).
	"""
	tlsHonorsClientCipherOrder: Boolean
}

enum TimelineSpanState {
	RUNNING
	COMPLETE
	FAILED
}

enum TimelineStage {
	PENDING_DOWNLOAD
	DOWNLOADING
	FINALIZING_DOWNLOAD
	PAUSED
	VERIFYING
	REPAIRING
	EXTRACTING
	INTERRUPTED
	FINAL_MOVE
}

"""
Latest stable release observed by the background release checker.
"""
type UpdateStatus {
	currentVersion: String!
	latestVersion: String
	updateAvailable: Boolean!
	releaseUrl: String
	publishedAtEpochMs: Int
	checking: Boolean!
	lastCheckedAtEpochMs: Int
	lastSuccessfulCheckAtEpochMs: Int
	lastError: String
}

"""
A multipart file upload
"""
scalar Upload

type WatchFolderMarkerRename {
	from: String!
	to: String!
	marker: String!
}

type WatchFolderScanIssue {
	path: String!
	reason: String!
}

type WatchFolderScanReport {
	discoveredFiles: [String!]!
	queuedNzbs: [String!]!
	skippedInputs: [WatchFolderScanIssue!]!
	permanentErrors: [WatchFolderScanIssue!]!
	transientErrors: [WatchFolderScanIssue!]!
	markerRenamedSources: [WatchFolderMarkerRename!]!
}

type WatchFolderSettings {
	mode: String!
	path: String
	pollIntervalSecs: Int!
	stabilitySecs: Int!
	categoryFromSubfolders: Boolean!
	scanningPaused: Boolean!
}

input WatchFolderSettingsInput {
	mode: String
	path: String
	pollIntervalSecs: Int
	stabilitySecs: Int
	categoryFromSubfolders: Boolean
	scanningPaused: Boolean
}

"""
Marks an element of a GraphQL schema as no longer supported.
"""
directive @deprecated(reason: String = "No longer supported") on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE
"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its field be provided)
"""
directive @oneOf on INPUT_OBJECT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: QueryRoot
	mutation: MutationRoot
	subscription: SubscriptionRoot
}
