type MutationRoot {
	"""
	Create a new API key. Returns the raw key (shown only once).
	"""
	createApiKey(name: String!, scope: ApiKeyScope!): CreateApiKeyResult!
	"""
	Delete an API key by ID.
	"""
	deleteApiKey(id: Int!): [ApiKey!]!
	"""
	Set the address Weaver listens on, applied at the next restart.
	
	Refused when `WEAVER_HTTP_BIND_ADDRESS` is set, rather than stored and
	silently ignored: an operator who pinned the address in their
	deployment should be told their edit would not take effect, not left to
	discover it after a restart. An empty value clears the setting back to
	the loopback default.
	"""
	setHttpBindAddress(address: String!): Boolean!
	"""
	Change the browser-admission policy: mode plus trusted networks.
	Applies immediately — trust is live state, unlike the bind address.
	"""
	setAccessPolicy(mode: String!, trustedNetworks: [String!]): Boolean!
	"""
	Enable login protection with a username and password.
	"""
	enableLogin(username: String!, password: String!): Boolean!
	"""
	Disable login protection.
	"""
	disableLogin: Boolean!
	"""
	Change the login password. Requires the current password for verification.
	"""
	changePassword(currentPassword: String!, newPassword: String!): Boolean!
	"""
	Add a new category.
	"""
	addCategory(input: CategoryInput!): Category!
	"""
	Update a category by ID.
	"""
	updateCategory(id: Int!, input: CategoryInput!): Category!
	"""
	Remove a category by ID.
	"""
	removeCategory(id: Int!): [Category!]!
	"""
	Submit an NZB for download through the public integration facade.
	"""
	submitNzb(input: SubmitNzbInput!): SubmissionResult!
	stageNzbUpload(input: StageNzbUploadInput!): StagedNzbUploadResult!
	submitStagedNzbs(input: SubmitStagedNzbsInput!): SubmitStagedNzbsResult!
	discardStagedNzbs(ids: [String!]!): Boolean!
	"""
	Pause a running job.
	"""
	pauseJob(id: Int!): Boolean!
	"""
	Resume a paused job.
	"""
	resumeJob(id: Int!): Boolean!
	"""
	Cancel and remove a job.
	"""
	cancelJob(id: Int!): Boolean!
	"""
	Reprocess a completed or failed job (re-run post-download stages without re-downloading).
	"""
	reprocessJob(id: Int!): Boolean!
	"""
	Re-download a completed or failed job from its persisted NZB under the same job ID.
	"""
	redownloadJob(id: Int!): Boolean!
	"""
	Delete a completed/failed/cancelled job from history.
	Returns the remaining history jobs after deletion.
	"""
	acceptHistoryDelete(input: AcceptHistoryDeleteInput!): HistoryDeleteAcceptance!
	"""
	Delete a completed/failed/cancelled job from history.
	Returns the remaining history jobs after deletion.
	"""
	deleteHistory(id: Int!, deleteFiles: Boolean! = false): [HistoryItem!]!
	"""
	Explicitly forget durable duplicate identity for a job without deleting history or files.
	"""
	forgetDuplicateIdentity(id: Int!): Boolean!
	markDuplicateGood(id: Int!): Boolean!
	markDuplicateBad(id: Int!): SemanticPromotionResult!
	promoteDuplicateCandidate(id: Int!): SemanticPromotionResult!
	"""
	Delete multiple completed/failed/cancelled jobs from history by ID.
	Returns the remaining history jobs after deletion.
	"""
	deleteHistoryBatch(ids: [Int!]!, deleteFiles: Boolean! = false): [HistoryItem!]!
	"""
	Delete all completed/failed/cancelled jobs from history.
	"""
	deleteAllHistory(deleteFiles: Boolean! = false): [HistoryItem!]!
	"""
	Update category and/or priority for one or more jobs.
	"""
	updateJobs(ids: [Int!]!, category: String, priority: String): Boolean!
	"""
	Set or clear a queued job's archive/unpack password. Passing null or
	an empty string removes the password (even one that came from the NZB
	itself); the override is durable across restarts. The password never
	appears in job attributes — only `hasPassword` reflects it.
	"""
	setJobPassword(id: Int!, password: String): Boolean!
	"""
	Move a queue item within the manual queue order. The move breaks ties
	within a dispatch priority band; HIGH/NORMAL/LOW still dominates.
	`offset` is required when `kind` is OFFSET (negative moves toward the
