type SubscriptionRoot {
	"""
	Subscribe to all pipeline events.
	"""
	events: PipelineEventGql!
	"""
	Admin-facing raw event stream.
	"""
	adminEvents: PipelineEventGql!
	"""
	Read-facing live snapshot for the job detail page.
	"""
	jobDetailUpdates(jobId: Int!): JobDetailSnapshot!
	"""
	Subscribe to real-time job state snapshots.
	
	Pushes a full snapshot whenever a pipeline event fires, throttled to
	at most once per 100ms so rapid-fire segment events don't flood the
	client. Also ticks every 2s during idle so speed gauges stay fresh.
	"""
	jobUpdates: JobsSnapshot!
	"""
	Subscribe to the public queue snapshot facade.
	"""
	queueSnapshots(filter: QueueFilterInput): QueueSnapshot!
	"""
	Subscribe to live public queue events.
	
	Replays recent in-memory queue events after `after`, then continues
	streaming live events from the same bounded replay buffer.
	"""
	queueEvents(after: String, filter: QueueFilterInput): QueueEvent!
	"""
	Subscribe to live log lines from the service.
	"""
	serviceLogLines: String!
	"""
	Subscribe to cadence-driven system metrics and global queue state.
	"""
	systemMetricsUpdates: SystemMetricsSnapshot!
}

