# Standalone yEnc encode bench: weaver's encode kernel against rapidyenc, in
# one process. Its own workspace, so a remote host builds only this crate and
# the kernel it includes by path, never the weaver workspace.
#
#   WEAVER_RAPIDYENC_SRC=/path/to/rapidyenc cargo run --locked --release -- [--quick]

[package]
name = "weaver-yenc-encode-bench"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[build-dependencies]
cc = "1"
