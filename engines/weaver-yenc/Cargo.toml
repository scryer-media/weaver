[package]
name = "weaver-yenc"
description = "yEnc encoding and decoding with streaming CRC verification"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
crc-fast = { workspace = true }
memchr = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Its AVX2 VPCLMULQDQ tier folds four 256-bit lanes (128 B per iteration); the
# CRC wrapper routes large updates there where crc-fast has no 256-bit tier.
crc32fast = "1.5.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = "0.8"
libloading = "0.9"
# Test-only oracle: pins `crc::crc32_combine` bit-identical to the
# `Crc32CombineOp` the server pipeline composes part CRCs with (see
# `tests/segment_combine.rs`). Deliberately NOT a workspace dependency and
# NOT a real dependency -- the yEnc codec must not link the PAR2 library, and
# the workspace entry carries `metal` features this needs none of. par2-rs
# refuses to build without a named crypto backend, so this names the same one
# the workspace does.
par2-rs = { version = "0.10.3", default-features = false, features = ["crypto-aws-lc"] }

[[bench]]
name = "decode_simd"
path = "benches/decode_simd.rs"
harness = false

[[bench]]
name = "rapidyenc_parity"
path = "benches/rapidyenc_parity.rs"
harness = false


[[bench]]
name = "crc_combine"
path = "benches/crc_combine.rs"
harness = false
