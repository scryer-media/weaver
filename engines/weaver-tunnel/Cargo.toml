[package]
name = "weaver-tunnel"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"

[features]
default = []
# In-process tunnel, DNS and proxy fixtures for consumer integration tests.
# Never enabled in a product build.
test-support = ["proxy-tunnels/test-support", "dep:bytes", "dep:http", "dep:h3", "dep:h3-quinn", "dep:quinn", "dep:rcgen", "dep:reqwest"]

[dependencies]
# Shared protocols pinned to an immutable signed version tag.
proxy-tunnels = { git = "https://github.com/scryer-media/proxy-tunnels.git", tag = "v0.5.2", features = ["http3"] }
base64 = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }
if-addrs = "0.15.0"
# DNS over TLS and over HTTPS, on the stream the routing layer dials.
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
# The host's trust store, read once and trusted beside webpki-roots, so an
# operator can add a root for DNS over TLS and HTTPS. Reads files or the OS
# keychain only; it dials nothing.
rustls-native-certs = { workspace = true }
# HTTP/2 or HTTP/1.1 on that stream only: no pooled client, no connector, no resolver.
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
# The HTTP/2 errors hyper passes on, read to tell a connection gone from a
# query the server reset or a response this side refused.
h2 = "0.4"
# DNSSEC validation of the replies the listed servers send. No I/O of its own.
weaver-dnssec = { path = "../weaver-dnssec" }

# Reuse the approved HTTP/3 stack for local fixtures; absent from product builds.
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
h3 = { git = "https://github.com/scryer-media/proxy-tunnels.git", tag = "v0.5.2", optional = true }
h3-quinn = { git = "https://github.com/scryer-media/proxy-tunnels.git", tag = "v0.5.2", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"], optional = true }
# Finished HTTP clients for consumers' tests.
reqwest = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
proxy-tunnels = { git = "https://github.com/scryer-media/proxy-tunnels.git", tag = "v0.5.2", features = ["http3", "test-support"] }
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
# The DNS over HTTPS fixture servers: HTTP/1.1 read by hand, HTTP/2 through
# h2, the protocol crate hyper itself uses, which can send a GOAWAY on cue.
httparse = { workspace = true }
# Signed fixture zones for the DNSSEC validation tests.
weaver-dnssec = { path = "../weaver-dnssec", features = ["test-support"] }

# The host name lookup lint names itself in `cfg(dylint_lib)` when it runs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] }
