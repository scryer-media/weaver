{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "weaver.serviceAccountName" . }}
  labels:
    {{- include "weaver.labels" . | nindent 4 }}
  {{- with include "weaver.annotations" (dict "root" . "extra" .Values.serviceAccount.annotations) }}{{ . | nindent 2 }}{{- end }}
# Weaver never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
