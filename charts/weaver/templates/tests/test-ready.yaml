apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-ready" (include "weaver.fullname" .) }}
  # Its own name label, so the Service and Deployment never select it.
  labels:
    helm.sh/chart: {{ include "weaver.chart" . }}
    app.kubernetes.io/name: {{ printf "%s-test" (include "weaver.name" .) | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: {{ .Values.securityContext.runAsUser }}
    runAsGroup: {{ .Values.securityContext.runAsGroup }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    # Weaver's own image carries busybox wget. Asking by the Service's name
    # also proves that name is on Weaver's Host allowlist.
    - name: readyz
      image: {{ include "weaver.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - wget
        - -q
        - -O
        - "-"
        - -T
        - "10"
        - {{ printf "http://%s.%s.svc:%v%s/readyz" (include "weaver.fullname" .) .Release.Namespace .Values.service.port (include "weaver.basePath" .) }}
      securityContext:
        {{- include "weaver.containerSecurityContext" . | nindent 8 }}
