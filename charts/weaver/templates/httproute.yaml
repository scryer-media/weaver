{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "weaver.fullname" . }}
  labels:
    {{- include "weaver.labels" . | nindent 4 }}
  {{- with include "weaver.annotations" (dict "root" . "extra" .Values.httpRoute.annotations) }}{{ . | nindent 2 }}{{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ include "weaver.routePath" . }}
      backendRefs:
        - name: {{ include "weaver.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
