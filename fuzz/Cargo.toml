[package]
name = "weaver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace, so cargo never adopts it into an enclosing one (a
# checkout nested inside another checkout of the repository).
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
weaver-nzb = { path = "../engines/weaver-nzb", default-features = false }
weaver-yenc = { path = "../engines/weaver-yenc", default-features = false }

[[bin]]
name = "nzb_parser"
path = "fuzz_targets/nzb_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yenc_article"
path = "fuzz_targets/yenc_article.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yenc_decode_tiers"
path = "fuzz_targets/yenc_decode_tiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yenc_encode_tiers"
path = "fuzz_targets/yenc_encode_tiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yenc_roundtrip"
path = "fuzz_targets/yenc_roundtrip.rs"
test = false
doc = false
bench = false
