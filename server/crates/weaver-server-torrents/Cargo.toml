[package]
name = "weaver-server-torrents"
description = "The torrent client and the speed test, over the pipeline"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# The test torrent's fixture, for other crates' tests.
test-support = [
    "weaver-server-pipeline/test-support",
    "weaver-server-orchestration/test-support",
    "weaver-tunnel/test-support",
]

[dependencies]
weaver-server-base = { path = "../weaver-server-base" }
weaver-server-disk = { path = "../weaver-server-disk" }
weaver-server-auth = { path = "../weaver-server-auth" }
weaver-server-settings = { path = "../weaver-server-settings" }
weaver-server-speedtest = { path = "../weaver-server-speedtest" }
weaver-server-torrent-store = { path = "../weaver-server-torrent-store" }
weaver-server-composition = { path = "../weaver-server-composition" }
weaver-server-pipeline = { path = "../weaver-server-pipeline" }
weaver-server-orchestration = { path = "../weaver-server-orchestration" }
weaver-tunnel = { path = "../../../engines/weaver-tunnel" }
weaver-graph = { path = "../../../engines/weaver-graph" }
weaver-model = { path = "../../../shared/crates/weaver-model", default-features = false }
weaver-nntp = { path = "../../../engines/weaver-nntp", default-features = false }
weaver-torrent = { workspace = true }
async-trait = "0.1"
# The storage trait weaver-torrent calls returns `anyhow::Result`.
anyhow = { version = "1", default-features = false, features = ["std"] }
bitvec = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
# The test torrent's session keeps its state in a scratch folder.
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
weaver-server-torrents = { path = ".", features = ["test-support"] }
weaver-server-pipeline = { path = "../weaver-server-pipeline", features = ["pipeline-test-fixtures"] }
weaver-server-orchestration = { path = "../weaver-server-orchestration", features = ["test-support"] }
weaver-server-torrent-store = { path = "../weaver-server-torrent-store", features = ["test-support"] }
weaver-server-base = { path = "../weaver-server-base", features = ["test-support"] }
weaver-server-disk = { path = "../weaver-server-disk", features = ["test-support"] }
weaver-nntp = { path = "../../../engines/weaver-nntp", default-features = false, features = ["test-support"] }
weaver-graph = { path = "../../../engines/weaver-graph", features = ["test-support"] }
weaver-tunnel = { path = "../../../engines/weaver-tunnel", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
base64 = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
par2-rs = { workspace = true, features = ["crypto-aws-lc"] }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-rustls = { workspace = true }
zip = { workspace = true }
