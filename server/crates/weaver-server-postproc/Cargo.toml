[package]
name = "weaver-server-postproc"
description = "Post-processing script discovery, declarations and directives"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
test-support = ["weaver-server-jobs/test-support", "weaver-server-history/test-support", "weaver-server-ingest/test-support"]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }
weaver-server-db = { path = "../weaver-server-db" }
weaver-server-base = { path = "../weaver-server-base" }
weaver-server-history = { path = "../weaver-server-history" }
weaver-server-jobs = { path = "../weaver-server-jobs" }
weaver-server-net = { path = "../weaver-server-net" }
weaver-server-settings = { path = "../weaver-server-settings" }
weaver-server-ingest = { path = "../weaver-server-ingest" }
weaver-server-rss = { path = "../weaver-server-rss" }
weaver-server-auth = { path = "../weaver-server-auth" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
weaver-nzb = { path = "../../../engines/weaver-nzb", default-features = false }
