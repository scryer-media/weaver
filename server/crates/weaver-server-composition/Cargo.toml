[package]
name = "weaver-server-composition"
description = "The composed database and the domain services below Weaver's download pipeline"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
pipeline-test-fixtures = ["test-support", "weaver-graph/test-support", "weaver-objects/test-support", "sevenz-turbo/compress", "lzma-turbo/enc"]
# Hooks that let other crates' tests move stored state directly instead of
# waiting on the wall clock. Never enabled outside dev-dependencies. The
# tunnel's loopback certificate backs the speed test's HTTPS fixture, and
# NNTP's direct test route serves servers built with no route of their own.
test-support = [
    "weaver-server-history/test-support",
    "weaver-server-migrations/test-support",
    "weaver-server-postproc/test-support",
    "weaver-tunnel/test-support",
    "weaver-nntp/test-support",
    "weaver-server-base/test-support",
    "weaver-server-disk/test-support",
    "weaver-server-rss/test-support",
    "weaver-server-torrent-store/test-support",
    "weaver-server-db/test-support",
    "weaver-server-net/test-support",
    "weaver-server-net-runtime/test-support",
    "weaver-server-speedtest/test-support",
    "weaver-server-ingest/test-support",
    "weaver-server-jobs/test-support",
    "weaver-server-auth/test-support",
]

[dependencies]
weaver-server-base = { path = "../weaver-server-base" }
weaver-server-disk = { path = "../weaver-server-disk" }
weaver-server-db = { path = "../weaver-server-db" }
weaver-server-rss = { path = "../weaver-server-rss" }
weaver-server-speedtest = { path = "../weaver-server-speedtest" }
weaver-server-torrent-store = { path = "../weaver-server-torrent-store" }
weaver-server-postproc = { path = "../weaver-server-postproc" }
weaver-server-net = { path = "../weaver-server-net" }
weaver-server-history = { path = "../weaver-server-history" }
weaver-server-jobs = { path = "../weaver-server-jobs" }
weaver-server-ingest = { path = "../weaver-server-ingest" }
weaver-server-auth = { path = "../weaver-server-auth" }
weaver-server-settings = { path = "../weaver-server-settings" }
weaver-server-migrations = { path = "../weaver-server-migrations" }
weaver-server-net-runtime = { path = "../weaver-server-net-runtime" }
weaver-tunnel = { path = "../../../engines/weaver-tunnel" }
async-trait = "0.1"
weaver-graph = { path = "../../../engines/weaver-graph" }
weaver-objects = { path = "../../../engines/weaver-objects" }
weaver-model = { path = "../../../shared/crates/weaver-model", default-features = false }
weaver-nntp = { path = "../../../engines/weaver-nntp", default-features = false }
weaver-nzb = { path = "../../../engines/weaver-nzb", default-features = false }
weaver-yenc = { path = "../../../engines/weaver-yenc", default-features = false }
par2-rs = { workspace = true, features = [
    "crypto-aws-lc",
] }
par3-rs = { workspace = true }
# Already in the graph through par2-rs; named directly so System info can read
# the XOR-JIT gate, which par2-rs does not re-export. The RAR3 recovery-volume
# tests also author their `.rev` fixture with its RS coder.
reedsolomon-rs = { version = "0.4.11", default-features = false }
unrar-rs = { workspace = true, features = [
    "crypto-aws-lc",
] }
serde = { workspace = true }
blake3 = { workspace = true }
crc-turbo = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
bitvec = { workspace = true }
weaver-torrent = { workspace = true }
# The storage trait weaver-torrent calls returns `anyhow::Result`.
anyhow = { version = "1", default-features = false, features = ["std"] }
sha1 = { workspace = true }
tokio = { workspace = true }
# Named for `rustls` itself: the upgrade downloader and the Sigstore trust-root
# refresh both need the process default crypto provider installed.
tokio-rustls = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true, default-features = false }
libc = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
notify = { workspace = true }
zstd = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
bzip2 = { workspace = true }
sqlx = { workspace = true }
rmp-serde = { workspace = true, default-features = false }
tempfile = { workspace = true }
filetime = { workspace = true }
base64 = { workspace = true }
sevenz-turbo = { workspace = true }
lzma-turbo = { workspace = true }
getrandom = { workspace = true, default-features = false }
hex = { workspace = true }
pbkdf2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }
security-framework-sys = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
cap-primitives = { workspace = true }
keyring = { workspace = true }
keyring-core = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
weaver-server-composition = { path = ".", features = ["pipeline-test-fixtures"] }
weaver-server-torrent-store = { path = "../weaver-server-torrent-store", features = ["test-support"] }
weaver-server-rss = { path = "../weaver-server-rss", features = ["test-support"] }
weaver-server-net = { path = "../weaver-server-net", features = ["test-support"] }
weaver-server-auth = { path = "../weaver-server-auth", features = ["test-support"] }
weaver-server-ingest = { path = "../weaver-server-ingest", features = ["test-support"] }
weaver-server-jobs = { path = "../weaver-server-jobs", features = ["test-support"] }
weaver-server-base = { path = "../weaver-server-base", features = ["test-support"] }
weaver-server-disk = { path = "../weaver-server-disk", features = ["test-support"] }
weaver-server-db = { path = "../weaver-server-db", features = ["test-support"] }
weaver-nntp = { path = "../../../engines/weaver-nntp", default-features = false, features = ["test-support"] }
weaver-graph = { path = "../../../engines/weaver-graph", features = ["test-support"] }
weaver-objects = { path = "../../../engines/weaver-objects", features = ["test-support"] }
weaver-tunnel = { path = "../../../engines/weaver-tunnel", features = ["test-support"] }
serde_json = { workspace = true }
# `test-util` for the paused clock: the health-probe reclaim tests assert on
# multi-second timeout budgets, which only a mocked clock can settle without
# either sleeping for real or trading determinism for speed.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# `compress` pulls in the 7z writer, which only the direct-unpack read-pattern
# tests need: they build their codec-matrix archives in-process rather than
# checking in a fixture per chain. Test-only on purpose — the shipped binary
# never encodes 7z.
sevenz-turbo = { workspace = true, features = ["compress"] }
axum = { workspace = true }
lzma-turbo = { workspace = true, features = ["enc"] }
# A tracker rule's certificate and keys, made in-test.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
