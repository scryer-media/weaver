[package]
name = "weaver-server-orchestration"
description = "The services that drive Weaver's scheduler: intake, feeds, watch folders, schedules, reload and recovery"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# The RSS service fixture, for other crates' tests.
test-support = ["weaver-server-pipeline/test-support"]

[dependencies]
weaver-server-base = { path = "../weaver-server-base" }
weaver-server-composition = { path = "../weaver-server-composition" }
weaver-server-disk = { path = "../weaver-server-disk" }
weaver-server-ingest = { path = "../weaver-server-ingest" }
weaver-server-pipeline = { path = "../weaver-server-pipeline" }
weaver-server-settings = { path = "../weaver-server-settings" }
weaver-model = { path = "../../../shared/crates/weaver-model", default-features = false }
weaver-nntp = { path = "../../../engines/weaver-nntp", default-features = false }
weaver-nzb = { path = "../../../engines/weaver-nzb", default-features = false }
async-trait = "0.1"
chrono = { workspace = true }
notify = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
weaver-server-pipeline = { path = "../weaver-server-pipeline", features = ["pipeline-test-fixtures"] }
weaver-server-base = { path = "../weaver-server-base", features = ["test-support"] }
weaver-server-disk = { path = "../weaver-server-disk", features = ["test-support"] }
weaver-nntp = { path = "../../../engines/weaver-nntp", default-features = false, features = ["test-support"] }
weaver-tunnel = { path = "../../../engines/weaver-tunnel", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
axum = { workspace = true }
base64 = { workspace = true }
filetime = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
