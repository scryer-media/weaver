          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --sign "Scryer Media Signing" --identifier media.weaver.app --force target/x86_64-apple-darwin/release/weaver
          codesign --verify --verbose target/x86_64-apple-darwin/release/weaver
          rm /tmp/cert.p12
          security delete-keychain "$KEYCHAIN"
      - name: Package tarball
        run: |
          mkdir -p dist/package
          cp target/x86_64-apple-darwin/release/weaver dist/package/weaver
          tar -czf weaver-darwin-x86_64-portable.tar.gz -C dist/package .
          test -f weaver-darwin-x86_64-portable.tar.gz
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weaver-darwin-x86_64-portable-${{ github.run_id }}
          path: weaver-darwin-x86_64-portable.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Show trusted tag sccache stats
        if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
        run: sccache --show-stats || true

