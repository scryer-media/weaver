  rust-package-windows-x86_64:
    name: rust-package-windows-x86_64
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    needs: [changes, verify-release-tag, web-build]
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.web-build.result == 'success' && (github.event_name != 'push' || needs.verify-release-tag.result == 'success') }}
    env:
      CARGO_INCREMENTAL: "0"
      AWS_LC_SYS_USE_SYSTEM: "0"
      AWS_LC_SYS_STATIC: "1"
      AWS_LC_SYS_SMALL: "0"
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      AWS_LC_SYS_PREBUILT_NASM: "0"
      CFLAGS_x86_64_pc_windows_msvc: "/O2 /DNDEBUG /Gy /Gw"
      CXXFLAGS_x86_64_pc_windows_msvc: "/O2 /DNDEBUG /Gy /Gw"
      # Windows builds use the rustls/aws-lc TLS backend; s2n-tls is a
      # cfg(not(windows)) dependency and is never compiled here.
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Install WiX v4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --tool-path .wix wix --version 4.0.5
          (Resolve-Path .wix) | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Restore sccache directory
        id: windows-x86_64-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}\.sccache
          key: gha-sccache-v1-weaver-package-windows-x86_64-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v1-weaver-package-windows-x86_64-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Configure trusted tag sccache
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: weaver/trusted-release/v1/rust-1.97.1/x86_64-pc-windows-msvc/
      - name: Install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
