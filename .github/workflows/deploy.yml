          retention-days: 14
      - name: Save sccache directory
        if: always() && steps.windows-arm64-sccache-restore.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ steps.windows-arm64-sccache-restore.outputs.cache-primary-key }}

  docker-publish-pr-rc:
    name: docker-publish-pr-rc
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.rust-fmt.result == 'success' &&
        needs.rust-clippy.result == 'success' &&
        needs.rust-audit.result == 'success' &&
        needs.rust-test.result == 'success' &&
        needs.rust-test-arm.result == 'success' &&
        needs.rust-test-sde.result == 'success' &&
        needs.rust-yenc-simd-targets.result == 'success' &&
        needs.rust-package-linux-x86_64-portable.result == 'success' &&
        needs.rust-package-linux-arm64-portable.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - rust-fmt
      - rust-clippy
      - rust-audit
      - rust-test
      - rust-test-arm
      - rust-test-sde
      - rust-yenc-simd-targets
      - rust-package-linux-x86_64-portable
      - rust-package-linux-arm64-portable
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts
      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-linux-arm64-portable-${{ github.run_id }}
          path: artifacts
      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve PR RC tags
        id: pr_rc_tags
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          echo "moving_tag=pr-${PR_NUMBER}-rc" >> "$GITHUB_OUTPUT"
          echo "commit_tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: pr_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/weaver
          tags: |
            type=raw,value=${{ steps.pr_rc_tags.outputs.moving_tag }}
            type=raw,value=${{ steps.pr_rc_tags.outputs.commit_tag }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-ctx
          file: docker/weaver.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.pr_meta.outputs.tags }}
          labels: ${{ steps.pr_meta.outputs.labels }}

  docker-publish:
    name: docker-publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - verify-release-tag
      - rust-fmt
      - rust-clippy
      - rust-audit
      - rust-test
      - rust-test-arm
      - rust-test-sde
      - rust-yenc-simd-targets
      - rust-package-linux-x86_64-portable
      - rust-package-linux-arm64-portable
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build_base.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts
      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-linux-arm64-portable-${{ github.run_id }}
          path: artifacts
      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/weaver
          tags: |
            type=raw,value=latest
            type=match,pattern=weaver-v(.*),group=1
      - name: Compute Docker tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/weaver
        run: |
          VERSION="${GITHUB_REF_NAME#weaver-v}"
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          {
            echo "base<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
            echo "${IMAGE_NAME}:${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push base image
        id: build_base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-ctx
          file: docker/weaver.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.base }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Sign published base image
        env:
          TAGS: ${{ steps.tags.outputs.base }}
          DIGEST: ${{ steps.build_base.outputs.digest }}
        run: |
          images_file="$(mktemp)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            printf '%s@%s\n' "$tag" "$DIGEST" >> "$images_file"
          done <<EOF
          $TAGS
          EOF
          xargs cosign sign --yes < "$images_file"

  generate-container-provenance:
    name: generate-container-provenance
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    needs: [docker-publish]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    # The prebuilt SLSA builder loader requires a refs/tags/vX.Y.Z workflow ref;
    # a commit-SHA pin makes the generator fail with "Invalid ref". Do not re-pin.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/weaver
      digest: ${{ needs.docker-publish.outputs.image_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-container-release:
    name: verify-container-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    runs-on: ubuntu-24.04
    needs: [docker-publish, generate-container-provenance]
    permissions:
      id-token: write
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify production image signature, provenance, and SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/weaver
          DIGEST: ${{ needs.docker-publish.outputs.image_digest }}
          SIGNATURE_IDENTITY: ^https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/tags/weaver-v.*$
          PROVENANCE_IDENTITY: ^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3\.yml@refs/tags/v2\.1\.0$
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "$SIGNATURE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /tmp/cosign-signature.json
          cosign verify-attestation \
            --new-bundle-format=false \
            --type slsaprovenance02 \
            --certificate-identity-regexp "$PROVENANCE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /tmp/slsa-provenance.json
          test -s /tmp/cosign-signature.json
          test -s /tmp/slsa-provenance.json
          index="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            subject_digest="$(jq -r \
              --arg os "$os" \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $architecture) | .digest' \
              <<< "$index")"
            test -n "$subject_digest" && test "$subject_digest" != null
            attestation_digest="$(jq -r \
              --arg subject "$subject_digest" \
              '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $subject) | .digest' \
              <<< "$index")"
            test -n "$attestation_digest" && test "$attestation_digest" != null
            docker buildx imagetools inspect --raw "$IMAGE@$attestation_digest" |
              jq -e 'any(.layers[]; .mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")' > /dev/null
          done

  github-release:
    name: github-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - rust-fmt
      - rust-clippy
      - rust-audit
      - rust-test
      - rust-test-arm
      - rust-test-sde
      - rust-yenc-simd-targets
      - rust-package-linux-x86_64-portable
      - rust-package-linux-arm64-portable
      - rust-package-darwin-x86_64-portable
      - rust-package-darwin-arm64-portable
      - rust-package-windows-x86_64
      - rust-package-windows-arm64
      - prepare-release-provenance
      - generate-release-provenance
      - verify-container-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment: release-credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      # Merge every run-scoped release artifact into one flat directory, the
      # same hand-off scryer's release job uses. Each of those artifacts is
      # uploaded with a flat root (packages, winget manifests, provenance
      # inputs), so the merge yields exactly the layout the -maxdepth 1 asset
      # census and the release-upload globs expect.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: weaver-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Download signed SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-provenance.intoto.jsonl
          path: artifacts
      - name: Verify release provenance and sign checksums
        env:
          IDENTITY: ^https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/tags/weaver-v.*$
        run: |
          set -euo pipefail
          mapfile -t release_assets < <(find artifacts -maxdepth 1 -type f \( -name 'weaver-*.tar.gz' -o -name 'weaver-*.zip' -o -name 'weaver-*.msi' -o -name 'weaver-*.spdx.json' \) -printf '%f\n' | sort)
          if [ "${#release_assets[@]}" -ne 16 ]; then
            echo "expected 16 release assets under artifacts/, found ${#release_assets[@]}:" >&2
            printf '  %s\n' "${release_assets[@]}" >&2
            exit 1
          fi
          for asset in "${release_assets[@]}"; do
            slsa-verifier verify-artifact "artifacts/${asset}" \
              --provenance-path artifacts/weaver-provenance.intoto.jsonl \
              --source-uri "github.com/${GITHUB_REPOSITORY}" \
              --source-tag "${GITHUB_REF_NAME}"
          done
          (
            cd artifacts
            for asset in "${release_assets[@]}"; do
              sha256sum "$asset"
            done
          ) > artifacts/weaver-checksums.txt
          cosign sign-blob --yes \
            --bundle artifacts/weaver-checksums.txt.sigstore.json \
            artifacts/weaver-checksums.txt
          cosign verify-blob \
            --bundle artifacts/weaver-checksums.txt.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            artifacts/weaver-checksums.txt
      - name: Attest Windows release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/weaver-windows-*.zip
            artifacts/weaver-windows-*.msi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/weaver-*.tar.gz \
            artifacts/weaver-*.zip \
            artifacts/weaver-*.msi \
            artifacts/weaver-*.msi.json \
            artifacts/weaver-*.spdx.json \
            artifacts/weaver-checksums.txt \
            artifacts/weaver-checksums.txt.sigstore.json \
            artifacts/weaver-provenance.intoto.jsonl
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#weaver-v}"
          LINUX_X86_PORTABLE_SHA=$(shasum -a 256 artifacts/weaver-linux-x86_64-portable.tar.gz | cut -d ' ' -f1)
          LINUX_ARM_PORTABLE_SHA=$(shasum -a 256 artifacts/weaver-linux-arm64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_X86_PORTABLE_SHA=$(shasum -a 256 artifacts/weaver-darwin-x86_64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_ARM_PORTABLE_SHA=$(shasum -a 256 artifacts/weaver-darwin-arm64-portable.tar.gz | cut -d ' ' -f1)
          REPO="${{ github.repository }}"

          mkdir -p formula
          cat > formula/weaver-usenet.rb << FORMULA
          require "rbconfig"

          module WeaverUsenetReleaseSelection
            def self.current_os
              host_os = RbConfig::CONFIG["host_os"].to_s.downcase
              return "macos" if host_os.include?("darwin")
              return "linux" if host_os.include?("linux")

              "unknown"
            end

            def self.current_arch
              host_cpu = RbConfig::CONFIG["host_cpu"].to_s.downcase
              return "arm64" if host_cpu.include?("aarch64") || host_cpu.include?("arm64")
              return "x86_64" if host_cpu.include?("x86_64") || host_cpu.include?("amd64")

              "unknown"
            end

            def self.asset_name(os:, arch:)
              case [os, arch]
              when ["linux", "x86_64"] then "weaver-linux-x86_64-portable.tar.gz"
              when ["linux", "arm64"] then "weaver-linux-arm64-portable.tar.gz"
              when ["macos", "x86_64"] then "weaver-darwin-x86_64-portable.tar.gz"
              when ["macos", "arm64"] then "weaver-darwin-arm64-portable.tar.gz"
              else
                raise "unsupported asset mapping: #{[os, arch].inspect}"
              end
            end

            def self.asset_url(repo:, version:, os:, arch:)
              "https://github.com/#{repo}/releases/download/weaver-v#{version}/#{asset_name(os: os, arch: arch)}"
            end

            def self.asset_sha256(os:, arch:, checksums:)
              checksums.fetch(asset_name(os: os, arch: arch))
            end

          end

          class WeaverUsenet < Formula
            desc "Unified Usenet binary downloader, repair, and extraction engine"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"
            RELEASE_REPO = "${REPO}"
            RELEASE_VERSION = "${VERSION}"
            CHECKSUMS = {
              "weaver-linux-x86_64-portable.tar.gz" => "${LINUX_X86_PORTABLE_SHA}",
              "weaver-linux-arm64-portable.tar.gz" => "${LINUX_ARM_PORTABLE_SHA}",
              "weaver-darwin-x86_64-portable.tar.gz" => "${DARWIN_X86_PORTABLE_SHA}",
              "weaver-darwin-arm64-portable.tar.gz" => "${DARWIN_ARM_PORTABLE_SHA}",
            }.freeze
            SELECTED_OS = WeaverUsenetReleaseSelection.current_os
            SELECTED_ARCH = WeaverUsenetReleaseSelection.current_arch

            url WeaverUsenetReleaseSelection.asset_url(
              repo: RELEASE_REPO,
              version: RELEASE_VERSION,
              os: SELECTED_OS,
              arch: SELECTED_ARCH,
            )
            sha256 WeaverUsenetReleaseSelection.asset_sha256(
              os: SELECTED_OS,
              arch: SELECTED_ARCH,
              checksums: CHECKSUMS,
            )

            def install_support_files
              (pkgshare/"config.env.example").write <<~EOS
                # Homebrew-managed Weaver service overrides.
                WEAVER_CONFIG=#{var}/weaver
                WEAVER_PORT=9090
                WEAVER_BASE_URL=/
              EOS

              (libexec/"weaver-service").write <<~SH
                #!/bin/sh
                CONFIG_FILE="#{etc}/weaver/config.env"

                if [ -f "\$CONFIG_FILE" ]; then
                  set -a
                  . "\$CONFIG_FILE"
                  set +a
                fi

                : "\${WEAVER_CONFIG:=#{var}/weaver}"
                : "\${WEAVER_PORT:=9090}"
                : "\${WEAVER_BASE_URL:=/}"

                exec "#{opt_bin}/weaver" --config "\$WEAVER_CONFIG" serve --port "\$WEAVER_PORT" --base-url "\$WEAVER_BASE_URL" "\$@"
              SH

              chmod 0755, libexec/"weaver-service"
            end

            def install
              bin.install "weaver"
              install_support_files

              config_dir = etc/"weaver"
              config_dir.mkpath
              config_file = config_dir/"config.env"
              unless config_file.exist?
                config_file.write <<~EOS
                  WEAVER_CONFIG=#{var}/weaver
                  WEAVER_PORT=9090
                  WEAVER_BASE_URL=/
                EOS
              end
            end

            def caveats
              <<~EOS
                Edit #{etc}/weaver/config.env to customize the Homebrew-managed service,
                then restart it with:
                  brew services restart weaver-usenet
              EOS
            end

            service do
              run [opt_libexec/"weaver-service"]
              keep_alive true
              log_path var/"log/weaver.log"
              error_log_path var/"log/weaver.log"
            end

            test do
              assert_match "weaver", shell_output("#{bin}/weaver --version")
            end
          end
          FORMULA

          sed -i 's/^          //' formula/weaver-usenet.rb
      - name: Smoke test Homebrew asset selection
        run: |
          ruby <<'RUBY'
          source = File.read("formula/weaver-usenet.rb")
          helper_source = source.split(/^class WeaverUsenet < Formula$/).first
          eval(helper_source, TOPLEVEL_BINDING, "formula/weaver-usenet.rb")

          def assert_equal(expected, actual, label)
            raise "#{label}: expected #{expected.inspect}, got #{actual.inspect}" unless expected == actual
          end

          def assert_source(source, pattern, label)
            raise "Homebrew upgrade contract missing: #{label}" unless source.match?(pattern)
          end

          def refute_source(source, pattern, label)
            raise "Homebrew upgrade contract changed: #{label}" if source.match?(pattern)
          end

          assert_source(source, /WEAVER_CONFIG=#\{var\}\/weaver/, "stable data directory")
          assert_source(source, /CONFIG_FILE="#\{etc\}\/weaver\/config\.env"/, "stable service config path")
          assert_source(source, /unless config_file\.exist\?\s+config_file\.write/m, "existing service config is preserved")
          assert_source(source, /run \[opt_libexec\/"weaver-service"\]/, "service uses the upgrade-stable opt path")
          refute_source(source, /^\s*WEAVER_HTTP_BIND_ADDRESS=/, "formula must not suppress the pre-0.9 bind shim")
          refute_source(source, /^\s*WEAVER_(?:ENCRYPTION_KEY|FORCE_KEY_FILE)=/, "formula must not change the existing encryption-key source")

          checksums = {
            "weaver-linux-x86_64-portable.tar.gz" => "linux-x86-portable",
            "weaver-linux-arm64-portable.tar.gz" => "linux-arm-portable",
            "weaver-darwin-x86_64-portable.tar.gz" => "darwin-x86-portable",
            "weaver-darwin-arm64-portable.tar.gz" => "darwin-arm-portable",
          }

          {
            ["linux", "x86_64"] => "weaver-linux-x86_64-portable.tar.gz",
            ["linux", "arm64"] => "weaver-linux-arm64-portable.tar.gz",
            ["macos", "x86_64"] => "weaver-darwin-x86_64-portable.tar.gz",
            ["macos", "arm64"] => "weaver-darwin-arm64-portable.tar.gz",
          }.each do |(os, arch), asset|
            assert_equal(asset, WeaverUsenetReleaseSelection.asset_name(os: os, arch: arch), "#{os} #{arch} asset")
            assert_equal(checksums.fetch(asset), WeaverUsenetReleaseSelection.asset_sha256(os: os, arch: arch, checksums: checksums), "#{os} #{arch} checksum")
          end
          assert_equal(
            "https://github.com/scryer-media/weaver/releases/download/weaver-v1.2.3/weaver-darwin-x86_64-portable.tar.gz",
            WeaverUsenetReleaseSelection.asset_url(repo: "scryer-media/weaver", version: "1.2.3", os: "macos", arch: "x86_64"),
            "macos x86 url",
          )
          RUBY
      - name: Publish Homebrew tap update
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN not set; skipping tap update."
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#weaver-v}"

          git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-weaver.git" tap-repo
          mkdir -p tap-repo/Formula
          cp formula/weaver-usenet.rb tap-repo/Formula/weaver-usenet.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/weaver-usenet.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
          else
            git commit -m "weaver ${VERSION}"
            git push origin HEAD:main
          fi

  marketing-site-rebuild:
    name: marketing-site-rebuild
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    needs: [github-release]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Trigger marketing site rebuild
        env:
          WEB_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEB_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN not set; skipping site rebuild."
            exit 0
          fi
          git clone "https://${WEB_TOKEN}@github.com/scryer-media/web.git" web-repo
          cd web-repo
          git config user.name "github-actions[bot]"
          git config user.email "133935777+NZBMan@users.noreply.github.com"
          git commit --allow-empty -m "rebuild: ${{ github.ref_name }}"
          git push origin HEAD:main

  winget-published-install:
    name: winget-published-install
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    needs: [github-release]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download generated WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-winget-manifests-${{ github.run_id }}
          path: winget-submission

      - name: Install the published x64 MSI through WinGet
        shell: pwsh
        run: |
          $manifestRoot = ".\\winget-manifests"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          tar -xzf winget-submission/weaver-winget-manifests.tar.gz -C $manifestRoot
          $version = "${{ github.ref_name }}".Replace("weaver-v", "")
          .\.github\scripts\validate-published-winget-install.ps1 `
            -ManifestRoot $manifestRoot `
            -ExpectedVersion $version

  winget-submit:
    name: winget-submit
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    needs: [github-release, winget-published-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: release-credentials
    steps:
      - name: Download verified WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weaver-winget-manifests-${{ github.run_id }}
          path: winget-submission

      - name: Submit WinGet manifest pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WINGET_TOKEN is required to submit the WinGet manifest pull request." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#weaver-v}"
          BRANCH="scryer-media-weaver-${VERSION}"
          ARCHIVE="${GITHUB_WORKSPACE}/winget-submission/weaver-winget-manifests.tar.gz"
          STAGING_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGING_DIR"' EXIT

          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$STAGING_DIR"
          MANIFEST_SOURCE="$STAGING_DIR/ScryerMedia.Weaver/$VERSION"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Weaver.yaml"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Weaver.locale.en-US.yaml"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Weaver.installer.yaml"

          FORK_OWNER="$(gh api user --jq .login)"
          TARGET_PATH="manifests/s/ScryerMedia/Weaver/${VERSION}"
          if gh api "repos/microsoft/winget-pkgs/contents/${TARGET_PATH}" > /dev/null 2>&1; then
            echo "ScryerMedia.Weaver ${VERSION} is already published in winget-pkgs."
            exit 0
          fi

          EXISTING_PR="$(gh pr list --repo microsoft/winget-pkgs --state open --head "${FORK_OWNER}:${BRANCH}" --json url --jq '.[0].url // empty')"

          if ! gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null 2>&1; then
            gh repo fork microsoft/winget-pkgs --clone=false
          fi
          for _ in {1..12}; do
            if gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null

          git clone --depth 1 --filter=blob:none --no-checkout --branch master \
            "https://x-access-token:${GH_TOKEN}@github.com/${FORK_OWNER}/winget-pkgs.git" winget-pkgs
          cd winget-pkgs
          git sparse-checkout init --cone
          git sparse-checkout set manifests/s/ScryerMedia/Weaver
          git checkout master
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          MANIFEST_DESTINATION="$TARGET_PATH"
          if [[ -d "$MANIFEST_DESTINATION" ]]; then
            rm -rf "$MANIFEST_DESTINATION"
          fi
          mkdir -p "$MANIFEST_DESTINATION"
          cp "$MANIFEST_SOURCE"/* "$MANIFEST_DESTINATION/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_DESTINATION"
          if ! git diff --cached --quiet; then
            git commit -m "Add ScryerMedia.Weaver version ${VERSION}"
            git push origin "$BRANCH"
          fi
          if [[ -z "$EXISTING_PR" ]]; then
            gh pr create \
              --repo microsoft/winget-pkgs \
              --base master \
              --head "${FORK_OWNER}:${BRANCH}" \
              --title "New version: ScryerMedia.Weaver version ${VERSION}" \
              --body "Automated manifest submission for [ScryerMedia.Weaver ${VERSION}](https://github.com/scryer-media/weaver/releases/tag/weaver-v${VERSION})."
          else
            echo "Updated WinGet submission awaiting review: $EXISTING_PR"
          fi

  winget-prep:
    name: winget-prep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [rust-package-windows-x86_64, rust-package-windows-arm64]
    permissions:
      contents: read
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'weaver-v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Download Windows release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          pattern: weaver-windows-*-${{ github.run_id }}
          merge-multiple: true

      - name: Resolve WinGet metadata
        id: winget_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#weaver-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate WinGet manifests
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask ci winget \
            --version "${{ steps.winget_meta.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --release-date "${{ steps.winget_meta.outputs.release_date }}" \
            --artifacts-dir release-artifacts \
            --output-dir winget-manifests

      - name: Package WinGet manifests
        shell: bash
        run: |
          set -euo pipefail
          tar -czf weaver-winget-manifests.tar.gz -C winget-manifests .
          test -s weaver-winget-manifests.tar.gz

      - name: Upload WinGet manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weaver-winget-manifests-${{ github.run_id }}
          path: weaver-winget-manifests.tar.gz
          if-no-files-found: error
          retention-days: 30

  prepare-release-provenance:
    name: prepare-release-provenance
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    runs-on: ubuntu-24.04
    needs:
      - verify-release-tag
      - rust-package-linux-x86_64-portable
      - rust-package-linux-arm64-portable
      - rust-package-darwin-x86_64-portable
      - rust-package-darwin-arm64-portable
      - rust-package-windows-x86_64
      - rust-package-windows-arm64
      - winget-prep
    permissions:
      actions: read
      contents: read
    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - name: Download release assets and WinGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: weaver-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate archive SBOMs and SLSA subject list
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          mapfile -t archives < <(find artifacts -maxdepth 1 -type f \( -name 'weaver-*.tar.gz' -o -name 'weaver-*.zip' \) -printf '%f\n' | sort)
          test "${#archives[@]}" -eq 7
          mapfile -t msi_packages < <(find artifacts -maxdepth 1 -type f -name 'weaver-*.msi' -printf '%f\n' | sort)
          test "${#msi_packages[@]}" -eq 2
          for archive in "${archives[@]}"; do
            "${{ steps.syft.outputs.cmd }}" "file:artifacts/${archive}" \
              -o "spdx-json=release-inputs/${archive%.*}.spdx.json"
          done
          {
            for archive in "${archives[@]}"; do
              sha256sum "artifacts/${archive}"
            done
            for package in "${msi_packages[@]}"; do
              sha256sum "artifacts/${package}"
            done
            find release-inputs -maxdepth 1 -type f -printf '%f\n' | sort | while read -r asset; do
              sha256sum "release-inputs/${asset}"
            done
          } | sed -e 's#artifacts/##' -e 's#release-inputs/##' > slsa-subjects.txt
          test "$(wc -l < slsa-subjects.txt)" -eq 16
          cp slsa-subjects.txt release-inputs/
      # Upload a single directory so the artifact root is flat, like every
      # other release artifact: a multi-path upload keys off the workspace
      # root and nests release-inputs/ one level deep, which hides the SBOMs
      # from the github-release job's merged flat download. The winget
      # manifest archive is not bundled here; it reaches github-release via
      # its own weaver-winget-manifests artifact.
      - name: Upload release provenance inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weaver-release-provenance-inputs-${{ github.run_id }}
          path: release-inputs/
          if-no-files-found: error
          retention-days: 14
      - name: Encode SLSA subjects
        id: subjects
        shell: bash
        run: echo "base64_subjects=$(base64 < slsa-subjects.txt | tr -d '\n')" >> "$GITHUB_OUTPUT"

  generate-release-provenance:
    name: generate-release-provenance
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    needs: [prepare-release-provenance]
    permissions:
      actions: read
      contents: write
      id-token: write
    # The prebuilt SLSA builder loader requires a refs/tags/vX.Y.Z workflow ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.prepare-release-provenance.outputs.base64_subjects }}
      provenance-name: weaver-provenance.intoto.jsonl
