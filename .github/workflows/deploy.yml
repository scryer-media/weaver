name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "weaver-v*"

concurrency:
  group: weaver-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "25"
  RUST_TOOLCHAIN: "1.97.1"
  WEAVER_ENABLE_DIAGNOSTICS: "0"
  WEB_ARTIFACT_NAME: weaver-web-dist
  WEAVER_LFS_RUST_TEST_INCLUDE: server/crates/weaver-server-core/tests/fixtures/**
  WEAVER_LFS_SDE_INCLUDE: ci/vendor/intel-sde/**

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        name: Detect validation scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rust=false
          web=false
          while IFS= read -r path; do
            case "$path" in
              apps/weaver-web/*)
                web=true
                ;;
              .github/*|docs/*|*.md|LICENSE|NOTICE)
                ;;
              *)
                rust=true
                ;;
            esac
          done < <(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")

          # Rust binaries embed the web artifact, so every Rust change needs it.
          if [[ "$rust" == true ]]; then
            web=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  verify-release-tag:
    name: verify-release-tag
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify trusted tag and release-branch ancestry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#weaver-v}"
          release_branch="release-${version}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signing-allowed-signers"
          git verify-tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin "refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" "origin/${release_branch}"

  # ── Parallel lint / check jobs (no dependencies) ─────────────────────────

  web-build:
    name: web-build
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/weaver-web/package-lock.json
      - name: Install dependencies
        working-directory: apps/weaver-web
        run: npm ci
      - name: Lint
        working-directory: apps/weaver-web
        run: npm run lint
      - name: Build web app
        working-directory: apps/weaver-web
        run: npm run build
      - name: Verify static output
        run: test -f apps/weaver-web/dist/index.html
      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: apps/weaver-web/dist
          if-no-files-found: error
          retention-days: 14

  rust-fmt:
    name: rust-fmt
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
      - name: Check formatting
        run: cargo fmt --check

  rust-audit:
    name: rust-audit
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo run -p xtask --locked -- ci audit

  # ── Jobs that need the web artifact ──────────────────────────────────────

  rust-clippy:
    name: rust-clippy
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.web-build.result == 'success' && (github.event_name != 'push' || needs.verify-release-tag.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, verify-release-tag, web-build]
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
      - name: Install sccache
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Configure trusted tag sccache
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: weaver/trusted-release/v1/rust-1.97.1/x86_64-unknown-linux-gnu/
      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: apps/weaver-web/dist
      - name: Run clippy
        run: cargo clippy --workspace --locked --lib --bins --tests --examples --benches -- -D warnings
      - name: Show trusted tag sccache stats
        if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
        run: sccache --show-stats || true

  rust-test:
    name: rust-test
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.web-build.result == 'success' && (github.event_name != 'push' || needs.verify-release-tag.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes, verify-release-tag, web-build]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hydrate Rust test fixtures
        run: |
          git lfs install --local
          git lfs pull --include="$WEAVER_LFS_RUST_TEST_INCLUDE" --exclude=""
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Restore sccache directory
        id: rust-test-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-v1-weaver-rust-test-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v1-weaver-rust-test-
            gha-sccache-v1-weaver-rust-test-build-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Configure trusted tag sccache
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: weaver/trusted-release/v1/rust-1.97.1/x86_64-unknown-linux-gnu/
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: nextest
      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: apps/weaver-web/dist
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Run Rust tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Show sccache stats
        if: always()
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache not installed; skipping stats"
          fi
      - name: Save sccache directory
        if: always() && steps.rust-test-sccache-restore.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.rust-test-sccache-restore.outputs.cache-primary-key }}

  rust-test-arm:
    name: rust-test-arm-yenc
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
      - name: Run ARM-specific yEnc crate tests (NEON)
        run: cargo test --locked --no-fail-fast -p weaver-yenc
      - name: Check out rapidyenc C oracle (pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: animetosho/rapidyenc
          ref: 27f435afa0a3a15995001219beca08de29f87a0f
          path: .ci/rapidyenc
          submodules: true
      - name: Run C-oracle differential tests (must not skip)
        env:
          RAPIDYENC_ROOT: ${{ github.workspace }}/.ci/rapidyenc
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p weaver-yenc --test rapidyenc_decode_diff -- --nocapture 2>&1 | tee /tmp/rapidyenc-diff.log
          if grep -q "skipping rapidyenc differential tests" /tmp/rapidyenc-diff.log; then
            echo "::error::rapidyenc differentials skipped despite RAPIDYENC_ROOT being set"
            exit 1
          fi

  rust-test-sde:
    name: rust-test-sde-yenc-${{ matrix.name }}
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: icl-gfni-avx2
            rustflags: "-C target-feature=+avx2,+gfni,+ssse3"
            sde_arch: "-icl"
          - name: spr-gfni-avx512
            rustflags: "-C target-feature=+avx512f,+avx512bw,+avx512vl,+avx512vbmi2,+avx2,+gfni,+ssse3"
            sde_arch: "-spr"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hydrate Intel SDE
        run: |
          git lfs install --local
          git lfs pull --include="$WEAVER_LFS_SDE_INCLUDE" --exclude=""
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
      - name: Install Intel SDE
        run: |
          SDE_ARCHIVE="ci/vendor/intel-sde/sde-external-9.48.0-2024-11-25-lin.tar.xz"
          echo "3173d2a5369e3385226b488d8b75403951bc14af601435fe707d9f83e0b533e6  ${SDE_ARCHIVE}" > /tmp/sde.sha256
          sha256sum -c /tmp/sde.sha256
          tar -xf "${SDE_ARCHIVE}" -C /opt
          echo "/opt/sde-external-9.48.0-2024-11-25-lin" >> "$GITHUB_PATH"
      - name: Build accelerated SIMD tests (${{ matrix.name }})
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -o pipefail
          cargo test --package weaver-yenc --lib --no-run --no-fail-fast --locked --target x86_64-unknown-linux-gnu --message-format=json \
            | jq -r 'select(.executable != null and .profile.test == true) | .executable' \
            | sort -u > /tmp/test-bins.txt
      - name: Run tests under Intel SDE (${{ matrix.name }})
        run: |
          failures=0
          run_sde() {
            if ! sde64 ${{ matrix.sde_arch }} -- "$@"; then
              failures=$((failures + 1))
            fi
          }
          # Same, but the test must also print `marker`. A tripwire that skips
          # itself still exits 0, so without this a lane that stopped emulating
          # the feature set under test would go green while testing nothing.
          # The test command MUST pass --nocapture or libtest swallows the
          # marker and the grep can never match.
          run_sde_expect() {
            marker="$1"; shift
            if out="$(sde64 ${{ matrix.sde_arch }} -- "$@" 2>&1)"; then
              printf '%s\n' "$out"
              if ! printf '%s\n' "$out" | grep -qF "$marker"; then
                echo "::error::expected marker not found: $marker" >&2
                failures=$((failures + 1))
              fi
            else
              printf '%s\n' "$out"
              failures=$((failures + 1))
            fi
          }
          while IFS= read -r bin; do
            echo "::group::$(basename "$bin")"
            case "$(basename "$bin")" in
              weaver_yenc-*)
                run_sde "$bin" simd::tests::decode_normal_run_dispatches --exact --test-threads=1
                run_sde "$bin" simd::tests::sse2_block_compacts_escapes_and_line_breaks --exact --test-threads=1
                run_sde "$bin" simd::tests::sse2_block_handles_dot_stuffed_line_start --exact --test-threads=1
                run_sde "$bin" simd::tests::sse2_block_preserves_trailing_cr_state --exact --test-threads=1
                run_sde "$bin" simd::tests::ssse3_block_compacts_escapes_and_line_breaks --exact --test-threads=1
                run_sde "$bin" simd::tests::ssse3_block_handles_dot_stuffed_line_start --exact --test-threads=1
                run_sde "$bin" simd::tests::ssse3_block_preserves_trailing_cr_state --exact --test-threads=1
                run_sde "$bin" simd::tests::sse41_block_compacts_escapes_and_line_breaks --exact --test-threads=1
                run_sde "$bin" simd::tests::sse41_block_handles_dot_stuffed_line_start --exact --test-threads=1
                run_sde "$bin" simd::tests::sse41_block_preserves_trailing_cr_state --exact --test-threads=1
                run_sde "$bin" simd::tests::avx_block_compacts_escapes_and_line_breaks --exact --test-threads=1
                run_sde "$bin" simd::tests::avx_block_handles_dot_stuffed_line_start --exact --test-threads=1
                run_sde "$bin" simd::tests::avx_block_preserves_trailing_cr_state --exact --test-threads=1
                run_sde "$bin" simd::tests::avx2_block_compacts_escapes_and_line_breaks --exact --test-threads=1
                run_sde "$bin" simd::tests::avx2_block_handles_dot_stuffed_line_start --exact --test-threads=1
                run_sde "$bin" simd::tests::avx2_block_preserves_trailing_cr_state --exact --test-threads=1
                run_sde "$bin" simd::tests::avx512_vbmi2_block_compacts_escapes_and_line_breaks --exact --test-threads=1
                run_sde "$bin" simd::tests::avx512_vbmi2_block_handles_dot_stuffed_line_start --exact --test-threads=1
                run_sde "$bin" simd::tests::avx512_vbmi2_block_preserves_trailing_cr_state --exact --test-threads=1
                run_sde "$bin" simd::tests::avx2_active_kernel_required_matches_scalar --ignored --exact --test-threads=1
                # The VBMI2 tripwire: on the SPR lane the emulated CPUID must
                # activate the VBMI2 tier in the *portable* build, so this lane
                # deliberately carries no +bmi/-C target-feature flags beyond
                # matrix.rustflags -- adding any would let the build satisfy the
                # feature gate without CPUID and blind the tripwire.
                if [ "${{ matrix.name }}" = "spr-gfni-avx512" ]; then
                  run_sde_expect "vbmi2-tripwire: VBMI2 tier ACTIVE" \
                    "$bin" simd::tests::vbmi2_active_kernel_required_matches_scalar --exact --test-threads=1 --nocapture
                else
                  run_sde "$bin" simd::tests::vbmi2_active_kernel_required_matches_scalar --exact --test-threads=1 --nocapture
                fi
                run_sde "$bin" simd::tests::forced_tier_kernels_match_scalar_with_line_hints --exact --test-threads=1
                run_sde "$bin" simd::tests::dispatch_kernel_matches_scalar_on_adversarial_streams --exact --test-threads=1
                run_sde "$bin" simd::tests::dispatch_kernel_matches_scalar_across_chunk_splits --exact --test-threads=1
                run_sde "$bin" simd::tests::dispatch_kernel_matches_scalar_on_hinted_encoded_streams --exact --test-threads=1
                run_sde "$bin" simd::tests::dispatch_kernel_handles_boundary_specials_like_scalar --exact --test-threads=1
                run_sde "$bin" decode::tests::decode_body_rapidyenc_generic_special_pattern --exact --test-threads=1
                ;;
              *)
                echo "unexpected SDE test binary: $(basename "$bin")" >&2
                exit 1
                ;;
            esac
            echo "::endgroup::"
          done < /tmp/test-bins.txt
          if [ "$failures" -ne 0 ]; then
            echo "$failures SDE test command(s) failed" >&2
            exit 1
          fi

  rust-yenc-simd-targets:
    name: rust-yenc-simd-${{ matrix.name }}
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: riscv64gc
            target: riscv64gc-unknown-linux-gnu
            target_env: RISCV64GC_UNKNOWN_LINUX_GNU
            rustflags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          cache-on-failure: false
          key: yenc-simd-${{ matrix.name }}
      - name: Check weaver-yenc target
        env:
          TARGET_ENV: ${{ matrix.target_env }}
          TARGET_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ -n "$TARGET_RUSTFLAGS" ]; then
            export "CARGO_TARGET_${TARGET_ENV}_RUSTFLAGS=$TARGET_RUSTFLAGS"
          fi
          cargo check --locked -p weaver-yenc --target ${{ matrix.target }}

  # ── Release packaging (tag pushes only) ──────────────────────────────────

  rust-package-linux-x86_64-portable:
    name: rust-package-linux-x86_64-portable
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, verify-release-tag, web-build]
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.web-build.result == 'success' && (github.event_name != 'push' || needs.verify-release-tag.result == 'success') }}
    env:
      AWS_LC_SYS_USE_SYSTEM: "0"
      AWS_LC_SYS_STATIC: "1"
      AWS_LC_SYS_SMALL: "0"
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      CFLAGS_x86_64_unknown_linux_musl: "-O3 -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden"
      CXXFLAGS_x86_64_unknown_linux_musl: "-O3 -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
