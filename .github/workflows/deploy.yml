          path: apps/weaver-web/dist
      - name: Set target CPU flags
        run: |
          printf 'RUSTFLAGS=%s\n' "$(cargo run -p xtask --locked -- print-rustflags --ci --target "x86_64-apple-darwin" --lane portable)" >> "$GITHUB_ENV"
      - name: Build release binary
        run: |
          export CMAKE_C_COMPILER="clang"
          export CMAKE_CXX_COMPILER="clang++"
          if [ "${WEAVER_SCCACHE_ENABLED:-false}" = "true" ]; then
            export CC="sccache clang"
            export CXX="sccache clang++"
            export CMAKE_C_COMPILER_LAUNCHER="sccache"
            export CMAKE_CXX_COMPILER_LAUNCHER="sccache"
          else
            export CC="clang"
            export CXX="clang++"
          fi
          cargo build -p weaver --release --locked --target x86_64-apple-darwin
      - name: Verify native libraries are statically bundled
        run: |
          BINARY="target/x86_64-apple-darwin/release/weaver"
          otool -L "$BINARY" | tee weaver-darwin-x86_64-portable-native-linkage.txt
          if grep -Eiq 'liblzma|aws[-_]?lc|libcrypto' weaver-darwin-x86_64-portable-native-linkage.txt; then
            echo "release binary dynamically links a bundled native library" >&2
            exit 1
          fi
      - name: Codesign binary
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/weaver-v') }}
