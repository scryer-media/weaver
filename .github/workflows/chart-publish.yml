name: chart publish

on:
  workflow_dispatch:

concurrency:
  group: weaver-chart-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chart-publish:
    name: chart-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The chart ships the Weaver release of the same version.
      - name: Check versions
        id: version
        run: |
          set -euo pipefail
          workspace="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          chart="$(sed -n 's/^version: *//p' charts/weaver/Chart.yaml)"
          app="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/weaver/Chart.yaml)"
          echo "workspace=$workspace chart=$chart appVersion=$app"
          [ -n "$workspace" ] && [ "$chart" = "$workspace" ] && [ "$app" = "$workspace" ]
          echo "version=$chart" >> "$GITHUB_OUTPUT"

      - name: Lint and package
        run: |
          set -euo pipefail
          helm lint --strict charts/weaver
          helm package charts/weaver --destination dist

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/weaver-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: *//p' push.log)"
          [ -n "$digest" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign published chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${OWNER}/charts/weaver:${VERSION}@${DIGEST}"
