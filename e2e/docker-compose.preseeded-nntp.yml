# Cache-hit override: NNTP article stores are baked into the local images.
# Keep the cert volume for TLS, but do not mask /data with a named volume: that
# would copy the full corpus out of the image for every phase.
services:
  nntp:
    volumes: !override
      - nntp-certs:/certs
      - ./.bin/nntp-health:/nntp-health:ro
  nntp2:
    volumes: !override
      - ./.bin/nntp-health:/nntp-health:ro
