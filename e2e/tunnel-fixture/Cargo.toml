[package]
name = "tunnel-fixture"
version = "0.1.0"
edition = "2024"
publish = false
description = "SSH and WireGuard endpoints for the Weaver advanced-networking e2e flows"

# A workspace of its own. The Weaver image builds from the repository root
# with `e2e` excluded from the build context, so this crate must never be a
# member of the product workspace. It depends on nothing from Weaver: the
# doubles come straight from proxy-tunnels at the revision Weaver pins.
[workspace]

[dependencies]
# Keep this rev identical to engines/weaver-tunnel/Cargo.toml.
proxy-tunnels = { git = "https://github.com/scryer-media/proxy-tunnels.git", rev = "a4b8897a2709ff6bd29e25a82ce47e22976460be", features = ["test-support"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "test-util"] }

[patch."https://github.com/scryer-media/proxy-tunnels.git"]
proxy-tunnels = { path = "../../../proxy-tunnels/.worktrees/wg-over-wg" }
