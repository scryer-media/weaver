[profile.default]
# Every schedule family is opt-in: nothing under the archive schedule modules,
# the 7z store schedules, or the PAR2 schedule modules runs in the default
# suite, smokes and single-case regressions included. They run only from the
# manually dispatched workflow or the matrix profiles below.
default-filter = 'not (test(archive_schedules::) | test(sevenz_store::schedules::) | test(par2::tests::schedules::) | test(direct_store::tests::par2_schedules::) | test(par2_completion::schedules::))'
# A test that leaves a child holding stdout or stderr open is a test failure.
leak-timeout = { period = "2s", result = "fail" }
# Tests wait on the events they check rather than racing a deadline of their
# own, so a hang is the runner's to end: flag a test after a minute, kill it
# after an hour. That is far above any real run, so a loaded runner cannot
# fail a test; it only bounds a stuck run and asserts nothing about speed.
slow-timeout = { period = "60s", terminate-after = 60 }

# macOS has no pipe2, so the standard library creates a test's stdio pipes and
# sets close-on-exec in two steps. A sibling test spawned inside that window
# inherits the pipe and keeps it open after the test it belongs to has exited,
# which the leak detector then reports against the innocent test. Linux creates
# the pipes atomically and keeps the strict policy.
[[profile.default.overrides]]
platform = { host = 'cfg(target_os = "macos")' }
leak-timeout = { period = "2s", result = "pass" }

# The archive campaigns run whole schedules per test, so a healthy one can take
# minutes on a shared runner: flag it every five minutes, kill it after twenty.

# The archive matrix: every schedule family except the extended modules.
# Run with: cargo nextest run --profile archive-matrix --run-ignored all --no-fail-fast
[profile.archive-matrix]
default-filter = '(test(archive_schedules::) | test(sevenz_store::schedules::) | test(par2::tests::schedules::) | test(direct_store::tests::par2_schedules::) | test(par2_completion::schedules::)) & not (test(archive_schedules::extended::) | test(sevenz_store::schedules::extended::))'
slow-timeout = { period = "300s", terminate-after = 12 }

# The extended campaigns are a separate, manually dispatched run: the whole of
# the extended modules, smokes included.
# Run with: cargo nextest run --profile archive-matrix-extended --run-ignored all --no-fail-fast
[profile.archive-matrix-extended]
default-filter = 'test(archive_schedules::extended::) | test(sevenz_store::schedules::extended::)'
slow-timeout = { period = "300s", terminate-after = 12 }

# The archive matrix and the extended campaigns together, as CI partitions them.
[profile.archive-matrix-all]
default-filter = 'test(archive_schedules::) | test(sevenz_store::schedules::) | test(par2::tests::schedules::) | test(direct_store::tests::par2_schedules::) | test(par2_completion::schedules::)'
slow-timeout = { period = "300s", terminate-after = 12 }
