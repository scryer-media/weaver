[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license-file.workspace = true

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Reading the release archives the upgrade manifest describes: every member's
# path, size and executable bit, and the artifact's BLAKE3 hash.
blake3 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { workspace = true, features = ["derive"] }
getrandom = { workspace = true }
hex = { workspace = true }
semver = { version = "1", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { version = "0.11", default-features = false }
tempfile = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
