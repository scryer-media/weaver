# Every outbound connection leaves on a saved route. Only the routing layer
# dials, resolves names or builds HTTP clients; everything else fetches with
# `weaver_server_core::proxies::routed_fetch` or `with_routed_client`. Each
# exception carries `#[expect(clippy::disallowed_methods, reason = ...)]` and
# is pinned by the route guard test in
# server/crates/weaver-server-core/src/proxies/route_guard_tests.rs.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "fetch with proxies::routed_fetch or proxies::with_routed_client, so the request takes its route" },
    { path = "reqwest::ClientBuilder::build", reason = "fetch with proxies::routed_fetch or proxies::with_routed_client, so the request takes its route" },
    { path = "reqwest::get", reason = "fetch with proxies::routed_fetch, so the request takes its route" },
    { path = "application_updater::pipeline::application_upgrade_http_client", reason = "hand the updater a client from proxies::with_routed_client, so the upgrade takes its route" },
    { path = "artifact_trust::prime_sigstore_trust_roots", reason = "prime with prime_sigstore_trust_roots_with and a client from proxies::with_routed_client, so the refresh takes its route" },
    { path = "artifact_trust::refresh_sigstore_trusted_root", reason = "refresh with refresh_sigstore_trusted_root_with and a client from proxies::with_routed_client, so the refresh takes its route" },
    { path = "tokio_tungstenite::connect_async", reason = "connect through the proxy runtime, so the connection takes its route" },
    { path = "tokio::net::TcpStream::connect", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "tokio::net::TcpSocket::connect", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "std::net::TcpStream::connect", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "std::net::TcpStream::connect_timeout", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "socket2::Socket::connect", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "socket2::Socket::connect_timeout", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "tokio::net::UdpSocket::bind", reason = "send through the proxy runtime, so the datagrams take their route" },
    { path = "std::net::UdpSocket::bind", reason = "send through the proxy runtime, so the datagrams take their route" },
    { path = "quinn::Endpoint::client", reason = "connect through the proxy runtime, so the connection takes its route" },
    { path = "tokio::net::lookup_host", reason = "resolve through the route's path, so the name never reaches the host resolver" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "resolve through the route's path, so the name never reaches the host resolver" },
    # The routing layer's own direct primitives.
    { path = "weaver_tunnel::resolution::connect_host", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "weaver_tunnel::resolution::host_lookup", reason = "resolve through the route's path, so the name never reaches the host resolver" },
    { path = "weaver_tunnel::resolution::host_lookup_blocking", reason = "resolve through the route's path, so the name never reaches the host resolver" },
    { path = "weaver_tunnel::egress::SocketEgress::connect", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "weaver_tunnel::egress::SocketEgress::connect_blocking", reason = "dial through the proxy runtime, so the connection takes its route" },
    { path = "weaver_tunnel::egress::SocketEgress::bind_udp", reason = "send through the proxy runtime, so the datagrams take their route" },
    { path = "weaver_nntp::route_dialer::AddressPlanned::new", reason = "take the server's dialer from its route in the proxy runtime" },
    { path = "weaver_tunnel::pipe::Egress::new", reason = "take the egress from the route in the proxy runtime" },
    # Every SQLite write takes the writer gate. Only the persistence runtime
    # writes; everything else sends its statement through
    # `StoreDatastore::write_exec()` and reads through `read_exec()`. Reads
    # (`fetch_one`, `fetch_all`, `fetch_optional`) stay open: a write that
    # returns rows (`INSERT ... RETURNING`) is caught at run time by the
    # read-lane classifier in persistence/sql_runtime.rs. Each exception carries
    # `#[expect(clippy::disallowed_methods, reason = "writer gate: ...")]` and is
    # pinned by the write guard test in
    # server/crates/weaver-server-core/src/persistence/write_guard_tests.rs.
    { path = "sqlx::query::Query::execute", reason = "write through StoreDatastore::write_exec(), so the statement takes the writer gate; reads go through read_exec()" },
    { path = "sqlx::query::Query::execute_many", reason = "write through StoreDatastore::write_exec(), so the statement takes the writer gate; reads go through read_exec()" },
    { path = "sqlx::Executor::execute", reason = "write through StoreDatastore::write_exec(), so the statement takes the writer gate; reads go through read_exec()" },
    { path = "sqlx::Executor::execute_many", reason = "write through StoreDatastore::write_exec(), so the statement takes the writer gate; reads go through read_exec()" },
    { path = "sqlx::RawSql::execute", reason = "write through StoreDatastore::write_exec(), so the statement takes the writer gate; reads go through read_exec()" },
    { path = "sqlx::RawSql::execute_many", reason = "write through StoreDatastore::write_exec(), so the statement takes the writer gate; reads go through read_exec()" },
    { path = "sqlx::Pool::begin", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Pool::try_begin", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Pool::begin_with", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Pool::try_begin_with", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Connection::begin", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Connection::begin_with", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Acquire::begin", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Transaction::commit", reason = "begin with StoreDatastore::write_exec().run_in_transaction(), so the transaction takes the writer gate" },
    { path = "sqlx::Pool::acquire", reason = "write through StoreDatastore::write_exec(), so the connection never writes outside the writer gate" },
    { path = "sqlx::Pool::try_acquire", reason = "write through StoreDatastore::write_exec(), so the connection never writes outside the writer gate" },
    { path = "sqlx::Acquire::acquire", reason = "write through StoreDatastore::write_exec(), so the connection never writes outside the writer gate" },
]
