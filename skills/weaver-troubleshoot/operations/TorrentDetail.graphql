# One torrent's state, route, swarm, unpack result and tracker status. Never
# selects tracker URLs, peer addresses or file lists. Scope: READ.
# Variables: {"id": 42}
query TorrentDetail($id: Int!) {
  torrent(id: $id) {
    id
    name
    state
    stated
    detail
    routeReason
    route
    routeConsumer
    private
    progress
    totalBytes
    haveBytes
    wastedBytes
    peers
    seeds
    leechers
    swarmSeeds
    swarmLeechers
    reannounceSeconds
    lastSeenCompleteMs
    activeSeconds
    seedingGoalLeft
    unpacking {
      result
      reason
    }
    trackers {
      tier
      source
      status
      updating
      message
      fails
      seeders
      leechers
      lastAnnounceMs
      nextAnnounceMs
      resolvedBy
    }
  }
}
