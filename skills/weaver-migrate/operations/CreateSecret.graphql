# Write. Keeps a value encrypted under a name for script inputs to link. The
# value is write-only. Build the variables file only with
# scripts/add-script-secret.sh. Needs the operator's yes on the name.
# Scope: ADMIN.
# Variables: {"name": "pushover-token", "value": "<from add-script-secret.sh>"}
mutation CreateSecret($name: String!, $value: String!) {
  createSecret(name: $name, value: $value) {
    id
    name
    updatedAt
  }
}
