# Write. Replaces a named secret's value; every job that links it gets the new
# value on its next run. Build the variables file only with
# scripts/add-script-secret.sh --id. Needs the operator's yes naming the secret
# and the jobs in its usedBy. Scope: ADMIN.
# Variables: {"id": "<secret id>", "name": "pushover-token",
#   "value": "<from add-script-secret.sh>"}
mutation UpdateSecret($id: String!, $name: String, $value: String) {
  updateSecret(id: $id, name: $name, value: $value) {
    id
    name
    updatedAt
    usedBy {
      id
      name
    }
  }
}
